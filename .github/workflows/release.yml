name: Release

# A version tag builds the signed APK and the Windows setup and puts them into a draft release
# (published by hand after checking the notes).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Artemis
        run: git submodule update --init --recursive --depth 1 artemis

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;27.0.12077973" "platforms;android-36" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.GAMELODGE_KEYSTORE_BASE64 }}
          GAMELODGE_KEYSTORE_PASSWORD: ${{ secrets.GAMELODGE_KEYSTORE_PASSWORD }}
          GAMELODGE_KEY_ALIAS: ${{ secrets.GAMELODGE_KEY_ALIAS }}
        run: |
          export GAMELODGE_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$GAMELODGE_KEYSTORE"
          ./gradlew :app:assembleStandardRelease :app:assembleSystemwideRelease --console=plain
          rm -f "$GAMELODGE_KEYSTORE"
          version=$(sed -n 's/^launcher.versionName=//p' gradle.properties)
          mkdir -p out
          cp app/build/outputs/apk/standard/release/app-standard-release.apk "out/GameLodge-$version.apk"
          cp app/build/outputs/apk/systemwide/release/app-systemwide-release.apk "out/GameLodge-Systemwide-$version.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk

  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      QT_VERSION: '6.11.1'
      RCEDIT_URL: https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe
      RCEDIT_SHA256: 3E7801DB1A5EDBEC91B49A24A094AAD776CB4515488EA5A4CA2289C400EADE2A
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # --- the bundled streaming client (moonlight-qt fork) ---
      - name: Patch moonlight-common-c
        working-directory: moonlight-qt
        run: python moonlight-common-c\patches\apollo-server-commands.py moonlight-common-c\moonlight-common-c\src

      - name: Moonlight dependencies
        working-directory: moonlight-qt
        run: powershell ./setup-deps.ps1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          cache: true
          set-env: false
          add-tools-to-path: false
          version: ${{ env.QT_VERSION }}
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e'

      - name: Build Moonlight
        working-directory: moonlight-qt
        shell: cmd
        run: |
          set "PATH=%QT_PATH%;%PATH%"
          call scripts\build-arch.bat Release x64 || exit /b 1
          mkdir ..\build\moonlight
          for %%f in (build\installer-x64-Release\MoonlightPortable-x64-*.zip) do copy /y "%%f" ..\build\moonlight\MoonlightPortable-x64.zip
        env:
          QT_PATH: ${{ github.workspace }}\..\Qt\${{ env.QT_VERSION }}\msvc2022_64\bin

      # --- native starter and the runtime's javaw.exe with the app's icon and version ---
      - name: Runtime starter (javaw.exe with the app's icon and version)
        shell: pwsh
        run: |
          $version = (Select-String -Path gradle.properties -Pattern '^launcher.versionName=(.*)$').Matches[0].Groups[1].Value
          ./gradlew :desktop:downloadWindowsJdk --console=plain
          $gradleHome = if ($env:GRADLE_USER_HOME) { $env:GRADLE_USER_HOME } else { "$env:USERPROFILE\.gradle" }
          $jdk = Get-ChildItem "$gradleHome\caches\gamelodge\OpenJDK21U-jdk_x64_windows_*.zip" | Select-Object -First 1
          if (-not $jdk) { throw "Windows JDK not found in $gradleHome" }
          $out = "build\windows-launcher"
          New-Item -ItemType Directory $out -Force | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($jdk.FullName)
          $entry = $zip.Entries | Where-Object { $_.FullName -like '*/bin/javaw.exe' } | Select-Object -First 1
          [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, "$out\runtime-GameLodge.exe", $true)
          $zip.Dispose()
          Invoke-WebRequest -UseBasicParsing $env:RCEDIT_URL -OutFile "$env:RUNNER_TEMP\rcedit.exe"
          if ((Get-FileHash "$env:RUNNER_TEMP\rcedit.exe" -Algorithm SHA256).Hash -ne $env:RCEDIT_SHA256) { throw 'rcedit checksum mismatch' }
          & "$env:RUNNER_TEMP\rcedit.exe" "$out\runtime-GameLodge.exe" --set-icon desktop\windows\icon.ico --set-version-string FileDescription GameLodge --set-version-string ProductName GameLodge --set-version-string CompanyName thecodingdad --set-version-string OriginalFilename GameLodge.exe --set-version-string InternalName GameLodge --set-file-version $version --set-product-version $version
          if ($LASTEXITCODE -ne 0) { throw 'rcedit failed' }

      # Same steps as tools/windows/launcher/build.bat, in a work folder with the icon next to the resources.
      - name: Native starter (GameLodge.exe)
        shell: cmd
        run: |
          for /f "tokens=2 delims==" %%a in ('findstr /b "launcher.versionName=" gradle.properties') do set "VER=%%a"
          for /f "tokens=1-3 delims=." %%a in ("%VER%") do set "VERC=%%a,%%b,%%c,0"
          set "W=%RUNNER_TEMP%\launcher"
          mkdir "%W%"
          copy /y tools\windows\launcher\launcher.c "%W%" >nul || exit /b 1
          copy /y tools\windows\launcher\launcher.rc "%W%" >nul || exit /b 1
          copy /y desktop\windows\icon.ico "%W%" >nul || exit /b 1
          pushd "%W%"
          rc /nologo /dVER_COMMA=%VERC% /dVER_TEXT=\"%VER%\" /fo launcher.res launcher.rc || exit /b 1
          cl /nologo /O2 /MT /W3 /DUNICODE /D_UNICODE launcher.c launcher.res /link /SUBSYSTEM:WINDOWS user32.lib /OUT:GameLodge.exe || exit /b 1
          popd
          copy /y "%W%\GameLodge.exe" build\windows-launcher\GameLodge.exe >nul || exit /b 1

      # --- app package and installer ---
      - name: Package app
        run: ./gradlew :desktop:windowsApp --console=plain

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y | Out-Null
          $version = (Select-String -Path gradle.properties -Pattern '^launcher.versionName=(.*)$').Matches[0].Groups[1].Value
          $stage = Resolve-Path desktop\build\windows\GameLodge
          New-Item -ItemType Directory out -Force | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" "/DSourceDir=$stage" "/DOutputDir=$PWD\out" desktop\windows\GameLodge.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC failed' }
          Rename-Item out\GameLodge-Setup.exe "GameLodge-Setup-$version.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*.exe

  metadata-server:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/gamelodge-metadata-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/') }}
      # Built by hand (workflow_dispatch) only to check it; pushed for release tags.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      # Only the app packages: the image build also leaves a build record artifact (not a zip).
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: assets
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" assets/* -R "$GITHUB_REPOSITORY" --draft --title "GameLodge ${TAG#v}" --notes "Release notes follow."
