name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The artemis submodule is a separate private repo that GITHUB_TOKEN cannot read;
      # SUBMODULE_TOKEN is a fine-grained read-only token for that repo only.
      - name: Checkout submodules
        env:
          SUBMODULE_TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/thecodingdad/moonlight-android".insteadOf "https://github.com/thecodingdad/moonlight-android"
          git submodule update --init --recursive --depth 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, lint and test
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
