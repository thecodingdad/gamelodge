name: Build

# Only for pull requests and by hand (release tags build in release.yml).
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Only Artemis: moonlight-qt (Windows streaming client) isn't part of the Android build.
      - name: Checkout Artemis
        run: git submodule update --init --recursive --depth 1 artemis

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner image ships the Android SDK (ANDROID_HOME); only the NDK is added.
      - name: Install NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;27.0.12077973" "platforms;android-36" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, lint and test
        run: ./gradlew assembleStandardDebug assembleHandheldDebug lintStandardDebug lintHandheldDebug testStandardDebugUnitTest --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/*/debug/*.apk
          retention-days: 14
