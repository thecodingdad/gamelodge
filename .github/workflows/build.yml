name: Build

# Only for pull requests, release tags and by hand: pushes don't use up the Actions minutes.
on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The artemis submodule is a separate private repo that GITHUB_TOKEN cannot read;
      # SUBMODULE_TOKEN is a fine-grained read-only token for that repo only.
      - name: Checkout submodules
        env:
          SUBMODULE_TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/thecodingdad/moonlight-android".insteadOf "https://github.com/thecodingdad/moonlight-android"
          git submodule update --init --recursive --depth 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner image ships the Android SDK (ANDROID_HOME); only the NDK is added.
      - name: Install NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;27.0.12077973" "platforms;android-36" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, lint and test
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
