site_name: GameLodge
site_description: All your games in one controller-first launcher – local, streamed and emulated.
site_url: https://thecodingdad.github.io/gamelodge/
repo_url: https://github.com/thecodingdad/gamelodge
repo_name: thecodingdad/gamelodge
edit_uri: edit/main/docs/
copyright: GameLodge is licensed under GPL-3.0. Game titles and artwork belong to their owners.

theme:
  name: material
  logo: assets/icon.svg
  favicon: assets/icon.svg
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.tabs.link

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started.md
      - Setup wizard: wizard.md
  - Library:
      - Overview: library.md
      - Filters, groups & collections: filters.md
      - Metadata & artwork: metadata.md
      - Play time & statistics: playtime.md
      - Emulators & ROMs: emulators.md
      - PC games (Windows): pc-games.md
  - Streaming:
      - Overview: streaming.md
      - Hosts & pairing: hosts.md
      - Xbox consoles: xbox.md
      - Stream profiles: profiles.md
      - VPN (WireGuard): vpn.md
  - Your PC as host (Windows):
      - Overview: pc-host.md
      - Streaming host: streaming-host.md
      - Devices & web interface: sharing.md
  - Controls:
      - Overview: controls.md
      - Controllers & shortcuts: controllers.md
      - Mouse emulation: mouse.md
      - Quick menu: quick-menu.md
  - Look & feel:
      - Overview: look-and-feel.md
      - Home tab & tiles: appearance.md
      - TV mode & screensaver: tv.md
  - Home Assistant: home-assistant.md
  - Backup & restore: backup.md
  - FAQ & troubleshooting: faq.md
