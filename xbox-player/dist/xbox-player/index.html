<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>GameLodge Xbox player</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  #videoHolder { position: fixed; inset: 0; }
  #videoHolder video { width: 100%; height: 100%; object-fit: var(--fit, contain); background: #000; visibility: hidden; }
  /* Sharpened picture (FSR): drawn here instead of the video. */
  #fsr { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; }
  /* A short notice at the stream's start (e.g. what the Guide button does here). */
  #hint { position: fixed; left: 50%; top: 6%; transform: translateX(-50%); max-width: 80%; padding: 12px 22px;
          border-radius: 14px; background: rgba(20, 22, 28, .88); color: #fff; font: 500 20px/1.35 system-ui, sans-serif;
          text-align: center; opacity: 0; transition: opacity .4s; pointer-events: none; }
  #hint.on { opacity: 1; }
</style>
</head>
<body>
<div id="videoHolder"></div>
<div id="fsr"><canvas id="canvas"></canvas></div>
<div id="hint"></div>
<script src="player.js"></script>
</body>
</html>
