guide_sgdb = So bekommst du den API-Schlüssel
guide_sgdb_1 = steamgriddb.com öffnen und anmelden (z. B. mit deinem Steam-Konto).
guide_sgdb_2 = Dein Profil → Preferences → API öffnen (der Link unten führt direkt dorthin).
guide_sgdb_3 = „Generate API Key“ wählen und den Schlüssel kopieren.
guide_sgdb_4 = Unten in das Feld einfügen und speichern.
guide_igdb = So bekommst du Client-ID und Secret
guide_igdb_1 = dev.twitch.tv öffnen und mit einem Twitch-Konto anmelden. Für Entwickler-Apps verlangt Twitch die Zwei-Faktor-Authentifizierung: bei Nachfrage in den Twitch-Sicherheitseinstellungen einschalten.
guide_igdb_2 = Console → Applications → „Register Your Application“ öffnen (der Link unten führt direkt dorthin).
guide_igdb_3 = Name: beliebig (z. B. „GameLodge“), OAuth Redirect URL: http://localhost, Category: „Application Integration“, Client Type: „Confidential“. Dann „Create“.
guide_igdb_4 = Bei der neuen App „Manage“ wählen: die Client-ID kopieren, dann mit „New Secret“ ein Secret erzeugen und kopieren (es wird nur einmal angezeigt).
guide_igdb_5 = Client-ID und Secret unten eintragen und speichern.
guide_open = Seite öffnen
